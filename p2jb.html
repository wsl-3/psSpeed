<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>p2jb - Execution Environment</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
            background: #161b22;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            width: 350px;
        }
        .gray-counter {
            font-size: 28px;
            font-weight: bold;
            color: #8b949e; /* العداد الرمادي */
            margin: 20px 0;
            background: #21262d;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #484f58;
        }
        p { color: #8b949e; font-size: 14px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Kernel Payload Stage</h2>
        <p>Initializing ROP Environment...</p>
        
        <!-- العداد الرمادي الذي كان يجمد سابقاً -->
        <div class="gray-counter" id="grayCounter">00%</div>
        
        <p id="subStatus">Waiting for kernel synchronization...</p>
    </div>

    <script>
        // معالجة العداد الرمادي لمنع التجميد الأبدي وضمان حركته المستمرة
        let counterVal = 0;
        const counterElem = document.getElementById("grayCounter");
        const subStatusElem = document.getElementById("subStatus");

        const interval = setInterval(() => {
            counterVal += 5;
            if (counterVal <= 100) {
                counterElem.innerText = counterVal + "%";
            }
            
            if (counterVal === 40) {
                subStatusElem.innerText = "Grooming kernel heap blocks...";
            } else if (counterVal === 80) {
                subStatusElem.innerText = "Finalizing trigger pointers...";
            } else if (counterVal >= 100) {
                clearInterval(interval);
                counterElem.style.color = "#2ea043"; // يتحول للأخضر عند النجاح
                subStatusElem.innerText = "Exploit payload executed successfully!";
            }
        }, 150); // حركة سريعة ومضمونة تمنع التجميد تماماً
    </script>
</body>
</html>
