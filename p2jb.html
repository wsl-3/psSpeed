<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>p2jb - Kernel Execution Environment</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
            background: #161b22;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            width: 380px;
        }
        .gray-counter {
            font-size: 32px;
            font-weight: bold;
            color: #8b949e; /* العداد الرمادي */
            margin: 20px 0;
            background: #21262d;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #484f58;
        }
        p { color: #8b949e; font-size: 14px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Kernel Payload Stage</h2>
        <p id="topStatus">Connecting with psSpy Accelerator...</p>
        
        <!-- العداد الرمادي -->
        <div class="gray-counter" id="grayCounter">00%</div>
        
        <p id="subStatus">Waiting for kernel synchronization...</p>
    </div>

    <script>
        // التقاط البيانات المرسلة من الصفحة الأولى للتأكد من نجاح البحث
        const urlParams = new URLSearchParams(window.location.search);
        const statusFlag = urlParams.get('payload');
        const attemptsMade = urlParams.get('attempts');

        const counterElem = document.getElementById("grayCounter");
        const topStatusElem = document.getElementById("topStatus");
        const subStatusElem = document.getElementById("subStatus");

        if (statusFlag === 'ready') {
            topStatusElem.innerText = "Pointer received! Initializing ROP...";
            
            let counterVal = 0;
            const interval = setInterval(() => {
                counterVal += 5;
                if (counterVal <= 100) {
                    counterElem.innerText = counterVal + "%";
                }
                
                if (counterVal === 30) {
                    subStatusElem.innerText = "Grooming kernel heap blocks...";
                } else if (counterVal === 70) {
                    subStatusElem.innerText = "Applying privilege escalation...";
                } else if (counterVal >= 100) {
                    clearInterval(interval);
                    counterElem.style.color = "#2ea043"; // تحول للأخضر عند اكتمال الـ 100%
                    topStatusElem.innerText = "Exploit Successful!";
                    subStatusElem.innerText = "Kernel patches applied. Ready for payloads.";
                }
            }, 100); // سرعة حركة الشريط لتكون ناعمة ومستقرة
            
        } else {
            // في حال تم فتح الصفحة بشكل مباشر بدون مرور بالثغرة
            topStatusElem.innerText = "Error: No exploit context found!";
            topStatusElem.style.color = "#f85149";
            subStatusElem.innerText = "Please start from index.html";
        }
    </script>
</body>
</html>
