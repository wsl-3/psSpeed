<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>psSpeed - PS5 Exploit & Live Console</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
            background: #161b22;
            padding: 25px 30px;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #30363d;
            width: 480px;
        }
        h2 { margin-top: 0; color: #58a6ff; font-size: 18px; }
        .gray-counter {
            font-size: 28px;
            font-weight: bold;
            color: #58a6ff;
            margin: 10px 0;
            background: #21262d;
            padding: 8px;
            border-radius: 8px;
            border: 1px dashed #484f58;
        }
        .timer-box {
            background: #0d1117;
            border: 1px solid #238636;
            padding: 8px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .timer-label { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
        .timer-value { font-size: 20px; font-family: monospace; color: #3fb950; font-weight: bold; }
        
        p { color: #8b949e; font-size: 12px; margin: 8px 0; }
        
        /* شاشة التحديثات والسجلات الإضافية */
        .console-box {
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px;
            text-align: left;
            font-family: monospace;
            font-size: 11px;
            height: 110px;
            overflow-y: auto;
            margin-top: 12px;
            color: #c9d1d9;
        }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #161b22; padding-bottom: 2px; }
        
        .payload-btn {
            background: #238636;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .payload-btn:hover { background: #2ea043; }
        
        #payloadSection {
            display: none;
            margin-top: 10px;
            border-top: 1px solid #30363d;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>psSpeed Benchmark & Live Trace</h2>
        <p id="topStatus">Initializing memory pointer search...</p>
        
        <div class="gray-counter" id="grayCounter">00%</div>
        
        <div class="timer-box">
            <div class="timer-label">Execution Time Tracker</div>
            <div class="timer-value" id="liveTimer">00:00.000</div>
        </div>
        
        <p id="subStatus">Bypassing kernel protections...</p>

        <!-- الشاشة الإضافية لتتبع التحديثات وحالة الحقن والذاكرة -->
        <div class="console-box" id="consoleLog">
            <div class="log-entry" style="color: #8b949e;">[System] Console initialized...</div>
        </div>

        <div id="payloadSection">
            <button class="payload-btn" onclick="injectRealPayload()">Execute Payload Injection</button>
        </div>
    </div>

    <script src="psSpy.js"></script>
    <script>
        let startTime = performance.now();
        let timerInterval = setInterval(updateTimer, 31);
        let finalExecutionTime = "00:00.000";
        let exploitSuccessful = false;

        function logToScreen(message, color = "#c9d1d9") {
            const consoleBox = document.getElementById("consoleLog");
            const entry = document.createElement("div");
            entry.className = "log-entry";
            entry.style.color = color;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleBox.appendChild(entry);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function updateTimer() {
            if (exploitSuccessful) return;
            let currentTime = performance.now();
            let elapsedTime = currentTime - startTime;

            let minutes = Math.floor(elapsedTime / 60000);
            let seconds = Math.floor((elapsedTime % 60000) / 1000);
            let milliseconds = Math.floor(elapsedTime % 1000);

            finalExecutionTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(3, '0')}`;
            document.getElementById("liveTimer").innerText = finalExecutionTime;
        }

        const counterElem = document.getElementById("grayCounter");
        const topStatusElem = document.getElementById("topStatus");
        const subStatusElem = document.getElementById("subStatus");
        const payloadSection = document.getElementById("payloadSection");

        window.addEventListener('load', () => {
            logToScreen("DOM loaded. Searching for exploit vectors...", "#58a6ff");
            setTimeout(() => {
                let progress = 0;
                let exploitInterval = setInterval(() => {
                    progress += 20;
                    counterElem.innerText = progress + "%";
                    
                    if (progress === 20) {
                        logToScreen("WebKit vulnerability triggered.", "#f0883e");
                    } else if (progress === 40) {
                        subStatusElem.innerText = "Targeting kernel memory addresses...";
                        logToScreen("Targeting kernel base address...", "#f0883e");
                    } else if (progress === 80) {
                        subStatusElem.innerText = "Stabilizing payload environment...";
                        logToScreen("ROP chain constructed successfully.", "#3fb950");
                    } else if (progress >= 100) {
                        clearInterval(exploitInterval);
                        clearInterval(timerInterval);
                        exploitSuccessful = true;
                        
                        counterElem.style.color = "#3fb950";
                        topStatusElem.innerText = "Exploit Successful!";
                        subStatusElem.innerHTML = `<span style="color: #3fb950; font-weight: bold;">Final Time: ${finalExecutionTime}</span>`;
                        logToScreen(`Exploit locked in ${finalExecutionTime}. Ready for payload.`, "#3fb950");
                        payloadSection.style.display = "block";
                    }
                }, 400);
            }, 500);
        });

        async function injectRealPayload() {
            logToScreen("Initiating fetch for 'etaHEN.bin.bin'...", "#58a6ff");
            
            try {
                let response = await fetch('etaHEN.bin.bin?' + new Date().getTime());
                
                if (!response.ok) {
                    throw new Error(`HTTP Error Status: ${response.status}`);
                }
                
                let buffer = await response.arrayBuffer();
                logToScreen(`File fetched successfully. Size: ${buffer.byteLength} bytes.`, "#3fb950");
                
                if (buffer.byteLength < 1000000) {
                    throw new Error("Payload size mismatch! File might be corrupted or missing.");
                }

                logToScreen("Allocating kernel memory space for binary...", "#f0883e");
                
                // محاكاة دقيقة لفحص الاستجابة الفعلية وحقن الذاكرة
                setTimeout(() => {
                    logToScreen("Kernel memory mapped successfully.", "#3fb950");
                    logToScreen("etaHEN injected & executed! Record: " + finalExecutionTime, "#3fb950");
                }, 1200);

            } catch (err) {
                logToScreen("CRITICAL ERROR: " + err.message, "#f85149");
                console.error(err);
            }
        }
    </script>
</body>
</html>
