<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PS5 Exploit Accelerator (psSpy)</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: monospace;
            text-align: center;
            padding-top: 20vh;
        }
        .container {
            border: 2px solid #00ffcc;
            display: inline-block;
            padding: 30px;
            border-radius: 10px;
            background: #1e1e1e;
            box-shadow: 0 0 15px rgba(0,255,204,0.3);
        }
        h1 { color: #00ffcc; font-size: 24px; }
        #status { font-size: 18px; margin: 15px 0; color: #ffcc00; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #00ffcc;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>psSpy Accelerator v1.0</h1>
        <div id="status">Initializing Fast-Spray Engine...</div>
        <div class="spinner"></div>
        <div id="counter">Attempt: 0</div>
    </div>

    <script src="psSpy.js"></script>
</body>
</html>
